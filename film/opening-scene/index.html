<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>من الظل إلى النور — مشهد الافتتاح</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; object-fit: contain; }
  body.render canvas { width: 1920px; height: 1080px; max-height: none; }
  #hint { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; color: #666;
          font: 13px system-ui, sans-serif; pointer-events: none; }
  body.render #hint { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hint">اضغط على الشاشة لإعادة التشغيل</div>
<script src="scene.js"></script>
</body>
</html>
